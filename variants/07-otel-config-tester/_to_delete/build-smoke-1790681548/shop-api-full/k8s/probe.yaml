# Rendered by scripts/render.mjs — configuration shop-api-full, run smoke.
# Do not edit; change configs/shop-api-full.json (or the configurator) and run scripts/run.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: 07-otel-config-tester
  labels:
    app: probe
  annotations:
    otel-config-tester/config: "shop-api-full"
    otel-config-tester/run-id: "smoke"
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the old pod is gone before the new one starts,
  # so two runs never send spans at the same time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
      annotations:
        otel-config-tester/config: "shop-api-full"
        otel-config-tester/run-id: "smoke"
    spec:
      containers:
        - name: probe
          image: "otel-probe:0847d772b886"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "database"
            - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
              value: "4096"
            - name: OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT
              value: "64"
            - name: OTEL_SPAN_EVENT_COUNT_LIMIT
              value: "32"
            - name: OTEL_SPAN_LINK_COUNT_LIMIT
              value: "32"
            - name: OTEL_EVENT_ATTRIBUTE_COUNT_LIMIT
              value: "16"
            - name: OTEL_LINK_ATTRIBUTE_COUNT_LIMIT
              value: "16"
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME),test.run.id=smoke,test.config.name=shop-api-full"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: PROBE_SOURCE
              value: "T2A.Shop"
            - name: PROBE_SELF_URL
              value: "http://probe:8080"
            - name: PROBE_RUN_ID
              value: "smoke"
            - name: PROBE_CONFIG_NAME
              value: "shop-api-full"
          # /health on purpose: real probe traffic is what the Filter options
          # are for. Without a /health filter there is one span every 10 s.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: 07-otel-config-tester
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 8080
      targetPort: 8080
