# ---- Kubernetes: container env ----------------------------------------
env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_SEMCONV_STABILITY_OPT_IN
    value: "database"
  - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
    value: "4096"
  - name: OTEL_SPAN_ATTRIBUTE_COUNT_LIMIT
    value: "64"
  - name: OTEL_SPAN_EVENT_COUNT_LIMIT
    value: "32"
  - name: OTEL_SPAN_LINK_COUNT_LIMIT
    value: "32"
  - name: OTEL_EVENT_ATTRIBUTE_COUNT_LIMIT
    value: "16"
  - name: OTEL_LINK_ATTRIBUTE_COUNT_LIMIT
    value: "16"
  - name: K8S_POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: K8S_NAMESPACE_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: "k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME)"

# ---- appsettings.json ---------------------------------------------------
# Merge into the "Logging" section:
{
  "Logging": {
    "LogLevel": {
      "Microsoft.EntityFrameworkCore.Database.Command": "Warning"
    }
  }
}
