# OTel collector for 07-otel-config-tester.
#
# Deliberately does NOTHING to the spans. This variant tests APP-side
# configurations generated by the configurator: filters, sampling, span limits.
# A collector-side filter or sampler would change what arrives and hide what
# the configuration did. In particular there is NO /health drop here (unlike
# variants 04-06): whether /health spans arrive is one of the things to test.
#
# Traces only: the configurator configures tracing, and the probe app sends
# nothing else.
#
# batch timeout is 1 s (baseline: 5 s) so a run is in ClickHouse shortly after
# the probe script ends. The app's own batch exporter is flushed by the probe
# script (POST /probe/flush).
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: 07-otel-config-tester
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1000

    exporters:
      clickhouse:
        endpoint: tcp://otel:otelpass@host.docker.internal:9000?dial_timeout=10s&compress=lz4
        database: otel_config_tester
        traces_table_name: otel_traces
        create_schema: true
        timeout: 10s
        retry_on_failure:
          enabled: true

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: 07-otel-config-tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.146.1
          args: ["--config=/conf/otel-collector-config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config-volume
              mountPath: /conf
      volumes:
        - name: config-volume
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: 07-otel-config-tester
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
