# Identical to the baseline k8s/12-quote-web.yaml except the namespace. Baseline image, unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-web
  namespace: 06-ef-core-sqlite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-web
  template:
    metadata:
      labels:
        app: quote-web
    spec:
      containers:
        - name: quote-web
          image: quote-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=06-ef-core-sqlite,k8s.pod.name=$(POD_NAME)"
            - name: Services__QuoteBaseUrl
              value: "http://quote-api:8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quote-web
  namespace: 06-ef-core-sqlite
spec:
  selector:
    app: quote-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
