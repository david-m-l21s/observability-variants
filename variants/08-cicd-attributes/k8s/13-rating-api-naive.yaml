# THE TRAP, deployed on purpose. Same app, same build, same manifest env as
# rating-api - only the image target differs (naive: build values baked straight
# into OTEL_RESOURCE_ATTRIBUTES). The manifest sets OTEL_RESOURCE_ATTRIBUTES too,
# and a container env var REPLACES the image's value. Expected result in
# ClickHouse: spans from this pod have the k8s.* attributes but NO
# service.version / vcs.* / cicd.*.
#
# It carries the label app: rating-api, so the rating-api Service sends it
# roughly half of the traffic. Starts at 0 replicas; scripts/07-trap.sh on|off.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-api-naive
  namespace: 08-cicd-attributes
spec:
  replicas: 0
  selector:
    matchLabels:
      app: rating-api
      flavour: naive
  template:
    metadata:
      labels:
        app: rating-api
        flavour: naive
    spec:
      containers:
        - name: rating-api
          image: __IMAGE_PREFIX__/rating-api:__TAG__-naive
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=08-cicd-attributes,k8s.pod.name=$(POD_NAME),deployment.environment.name=lab"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
