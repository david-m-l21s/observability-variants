# OTel collector for 08-cicd-attributes.
#
# Deliberately the baseline collector. This variant tests where resource
# attributes come FROM (pipeline -> image -> process); if the collector added or
# changed attributes, the result would prove nothing. Two differences only:
#   1. database: cicd_attributes  (own ClickHouse database, per VARIANTS.md)
#   2. filter/drop_health         (same as variants 04-06: probe spans would pad
#                                  every count in 08-inspect.sh)
# No k8sattributes processor: the k8s.* attributes come from the manifest, which
# is exactly the situation where the OTEL_RESOURCE_ATTRIBUTES overwrite trap bites.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: 08-cicd-attributes
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      filter/drop_health:
        error_mode: ignore
        traces:
          span:
            - 'IsMatch(name, ".*healthz.*")'
            - 'attributes["url.path"] == "/healthz"'
            - 'attributes["http.route"] == "/healthz"'

      batch:
        timeout: 5s
        send_batch_size: 1000

    exporters:
      clickhouse:
        endpoint: tcp://otel:otelpass@host.docker.internal:9000?dial_timeout=10s&compress=lz4
        database: cicd_attributes
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        metrics_table_name: otel_metrics
        create_schema: true
        timeout: 10s
        retry_on_failure:
          enabled: true

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [filter/drop_health, batch]
          exporters: [clickhouse]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: 08-cicd-attributes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.146.1
          args: ["--config=/conf/otel-collector-config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config-volume
              mountPath: /conf
      volumes:
        - name: config-volume
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: 08-cicd-attributes
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
