apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-api
  namespace: 08-cicd-attributes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rating-api
      flavour: final
  template:
    metadata:
      labels:
        app: rating-api
        flavour: final
    spec:
      containers:
        - name: rating-api
          # Rendered by scripts/04-deploy.sh (placeholders -> build/). The tag is
          # the CI version (<run_number>-<short sha>), never :latest, so every
          # deploy of a new build replaces the pods.
          image: __IMAGE_PREFIX__/rating-api:__TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            # DEPLOY-time attributes only. The build-time ones are in the image
            # (OTEL_BUILD_ATTRIBUTES) and are appended at container start.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=08-cicd-attributes,k8s.pod.name=$(POD_NAME),deployment.environment.name=lab"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rating-api
  namespace: 08-cicd-attributes
spec:
  selector:
    app: rating-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
