# quote-web is UNCHANGED from the baseline, so this variant reuses the baseline
# image quote-web:v1 as-is. Only quote-api and rating-api needed code changes
# (the tier marker and the eligibility ruleset), which is why only those two are
# rebuilt as *-tm:v1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-web
  namespace: 05-telescope-vs-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-web
  template:
    metadata:
      labels:
        app: quote-web
    spec:
      containers:
        - name: quote-web
          image: quote-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=05-telescope-vs-microscope,k8s.pod.name=$(POD_NAME)"
            - name: Services__QuoteBaseUrl
              value: "http://quote-api:8080"
            - name: Logging__LogLevel__Default
              value: "Information"
            - name: Logging__LogLevel__Microsoft
              value: "Warning"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quote-web
  namespace: 05-telescope-vs-microscope
spec:
  selector:
    app: quote-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
