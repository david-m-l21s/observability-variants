apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote-api
  namespace: 05-telescope-vs-microscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote-api
  template:
    metadata:
      labels:
        app: quote-api
    spec:
      containers:
        - name: quote-api
          image: quote-api-tm:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=05-telescope-vs-microscope,k8s.pod.name=$(POD_NAME)"
            # Log levels are part of this variant's point.
            #   Default=Information  the app's own INFO lines -> ClickHouse
            #   Microsoft=Warning    framework request logs off, so the numbers
            #                        in 08-measure-split.sh stay readable
            #   Program=Debug        the app's own LogDebug lines -> Loki
            # Set Default=Debug (scripts/07-trigger-defect.sh flood) to add the
            # framework debug torrent and watch ClickHouse NOT grow.
            - name: Logging__LogLevel__Default
              value: "Information"
            - name: Logging__LogLevel__Microsoft
              value: "Warning"
            - name: Logging__LogLevel__Program
              value: "Debug"
            - name: Services__RatingBaseUrl
              value: "http://rating-api:8080"
            # v1 = correct rules. v2 = the regression (suburban unlicensed).
            # Flip with: scripts/07-trigger-defect.sh break | restore
            - name: QUOTE_ELIGIBILITY_RULESET
              value: "v1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: quote-api
  namespace: 05-telescope-vs-microscope
spec:
  selector:
    app: quote-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
