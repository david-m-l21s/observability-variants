# Grafana for the 05-telescope-vs-microscope variant.
#
# In-cluster and dedicated to this variant, for the same reason as variant 04:
# the dashboard has to reach BOTH stores, and from inside the cluster that is one
# clean direction — ClickHouse via host.docker.internal (the path the collector
# already uses) and Loki via normal service DNS. The Lima VM Grafana stays
# untouched.
#
# Two datasources, one dashboard, all provisioned from config. Nothing is
# clicked by hand, so the whole thing is reproducible and reviewable. The
# dashboard is the demo script: read its top text panel first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: 05-telescope-vs-microscope
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      # The SYSTEM store — spans plus INFO/WARN/ERROR logs.
      - name: ClickHouse-TM
        uid: clickhouse-tm
        type: grafana-clickhouse-datasource
        access: proxy
        isDefault: true
        editable: true
        jsonData:
          host: host.docker.internal
          port: 9000
          protocol: native
          username: otel
          defaultDatabase: telescope_vs_microscope
        secureJsonData:
          password: otelpass

      # The DEBUG store — Debug/Trace and anything marked telemetry.tier=debug.
      - name: Loki-TM
        uid: loki-tm
        type: loki
        access: proxy
        editable: true
        url: http://loki:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: 05-telescope-vs-microscope
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: telescope-vs-microscope
        orgId: 1
        folder: Variants
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
